<!-- @dsCard height=288 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Beautiful UI</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { background: var(--page); color: var(--ink); font-family: var(--font-sans); overflow: hidden; }
  .cover { position: relative; width: 960px; height: 288px; overflow: hidden; }
  .art { position: absolute; top: 0; left: 0; width: 960px; height: 288px; }
  .accent { fill: var(--accent); rx: var(--radius-card); }
  .deep { fill: var(--ink); rx: var(--radius-window); }
  .tint { fill: var(--accent-tint); rx: var(--radius-card); }
  .tile { fill: var(--canvas); rx: var(--radius-chip); }
  .tile.sel { fill: var(--accent); }
  .tile.ok { fill: var(--green); }
  .tile.warn { fill: var(--orange); }
  .pill-g { fill: var(--green); rx: 12px; }
  .pill-o { fill: var(--orange); rx: 12px; }
  .words { position: absolute; left: 32px; bottom: 32px; max-width: 440px; }
  .name { margin: 0; font-size: 80px; line-height: .95; font-weight: 600; letter-spacing: -0.03em; color: var(--ink); font-feature-settings: "cv11", "ss01"; }
  .tag { margin: 12px 0 0 2px; font-size: 14px; line-height: 20px; letter-spacing: -0.01em; color: var(--ink-2); }
</style>
</head>
<body>
<div class="cover">
<svg class="art" viewBox="0 0 960 288" width="960" height="288" aria-hidden="true">
<!--
  blocks      accent 144x240 bled off the top, 144x208 (the one hue) · ink 336x216 bleeding off the right (the neutral-first ink) · accent-tint 144x56 under the slab · green and orange as 24px-tall pills only (condiments, never big) — about 35% of 960x288
  arrangement one tall accent slab with an ink panel beside it, bottoms on one line, space-4 gutters, satellites under the slab
  pattern     tiles cut by radius tokens, some merged two-wide (row "geometric, modular, dense UI"): a records grid of canvas cells on the ink panel, one selected cell in accent, one green and one orange tag cell, because the system is tables, rows and status pills
  scales      sides in space-2 multiples; gutters space-4 (16); cell height space-6 (24), gaps space-2 (8); corners radius-card, radius-window, radius-chip; pills radius-pill (rx = half of 24)
-->
<rect class="accent" x="480" y="-16" width="144" height="208" rx="10"/>
<rect class="tint" x="480" y="208" width="144" height="56" rx="10"/>
<rect class="pill-g" x="496" y="224" width="56" height="24" rx="12"/>
<rect class="pill-o" x="560" y="224" width="48" height="24" rx="12"/>
<rect class="deep" x="640" y="48" width="336" height="216" rx="14"/>
<rect class="tile" x="656" y="64" width="72" height="24"/>
<rect class="tile" x="736" y="64" width="32" height="24"/>
<rect class="tile" x="776" y="64" width="104" height="24"/>
<rect class="tile" x="888" y="64" width="56" height="24"/>
<rect class="tile sel" x="656" y="96" width="72" height="24"/>
<rect class="tile" x="736" y="96" width="32" height="24"/>
<rect class="tile" x="776" y="96" width="168" height="24"/>
<rect class="tile" x="656" y="128" width="136" height="24"/>
<rect class="tile" x="800" y="128" width="104" height="24"/>
<rect class="tile ok" x="912" y="128" width="32" height="24"/>
<rect class="tile" x="656" y="160" width="72" height="24"/>
<rect class="tile" x="736" y="160" width="32" height="24"/>
<rect class="tile" x="776" y="160" width="104" height="24"/>
<rect class="tile" x="888" y="160" width="56" height="24"/>
<rect class="tile" x="656" y="192" width="72" height="24"/>
<rect class="tile" x="736" y="192" width="144" height="24"/>
<rect class="tile warn" x="888" y="192" width="56" height="24"/>
<rect class="tile" x="656" y="224" width="72" height="24"/>
<rect class="tile" x="736" y="224" width="32" height="24"/>
<rect class="tile" x="776" y="224" width="104" height="24"/>
<rect class="tile" x="888" y="224" width="56" height="24"/>
</svg>
<div class="words">
  <h1 class="name">Beautiful<br>UI</h1>
  <p class="tag">Crafted primitives for AI-native interfaces.</p>
</div>
</div>
</body>
</html>
