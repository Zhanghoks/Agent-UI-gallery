<!-- @dsCard group="Canvas" height=200 subtitle="Ink already drawn, selected by region" -->
<div class="wrap grid-bg">
  <div style="display:flex; flex-direction:column; align-items:center; gap:12px">
    <span class="tb">
      <span class="cap">12 strokes</span><span class="d"></span>
      <span class="sw sel" style="background: var(--ink-black)"></span>
      <span class="sw" style="background: var(--accent-red)"></span>
      <span class="sw" style="background: var(--accent-blue)"></span>
      <span class="d"></span>
      <button class="ib"><span class="pv" style="height:3px"></span></button>
      <button class="ib"><span class="pv" style="height:6px"></span></button>
      <span class="d"></span>
      <button class="ib"><i class="g"></i>Split out</button>
      <button class="ib" style="color: var(--danger)"><i class="g"></i></button>
    </span>
    <svg width="250" height="70" viewBox="0 0 250 70" aria-hidden="true">
      <path class="lasso" d="M30 12 C 90 0, 170 6, 220 22 C 236 46, 180 66, 110 62 C 44 58, 12 38, 30 12 Z"/>
      <path class="ink" d="M46 40 C 72 16, 96 56, 124 30 S 176 18, 206 38"/>
      <path class="ink t" d="M52 52 C 96 46, 146 56, 200 48"/>
    </svg>
  </div>
  <div class="note">A stroke selection is a <i>region</i>, not a node: the count is of strokes, and the actions
    restyle or extract exactly those strokes. Colour and size reuse the sketch pickers so the bar matches the one
    used while drawing. <b>Split out</b> makes the selection its own sketch node.</div>
</div>

<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--bg-surface); color: var(--fg-default); }
  .wrap { padding: 14px 16px; background: var(--bg-surface); }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .row + .row { margin-top: 12px; }
  .lbl { font-size: 10px; font-weight: 500; color: var(--fg-subtle); min-width: 84px; }
  .note { margin-top: 12px; padding-top: 10px; border-top: var(--border-hairline) solid var(--edge-default);
          font-size: 11px; line-height: 1.7; color: var(--fg-muted); }
  .note b { color: var(--fg-default); font-weight: 500; }
  code { font-family: var(--font-mono); font-size: 10px; color: var(--fg-default); }
  
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer;
         font-family: inherit; font-size: 12px; line-height: 16px; padding: 4px 10px;
         border-radius: var(--radius-md); border: var(--border-hairline) solid var(--edge-default);
         background: var(--bg-surface); color: var(--fg-muted); }
  .btn:hover { background: var(--bg-hover); }
  .btn.ghost { border: none; background: transparent; }
  .btn.ghost:hover { background: var(--bg-hover); }
  .panel { background: var(--bg-surface); border: var(--border-hairline) solid var(--edge-default);
           border-radius: var(--radius-md); box-shadow: var(--elevation-toast); padding: 4px 0; min-width: 176px; }
  .item { display: flex; align-items: center; gap: 8px; width: 100%; box-sizing: border-box;
          padding: 6px 12px; font-size: 12px; font-weight: 500; color: var(--fg-muted);
          background: transparent; border: none; cursor: pointer; text-align: left; }
  .item:hover { background: var(--bg-hover); }
  .item .sc { margin-left: auto; font-size: 12px; font-weight: 400; color: var(--fg-subtle); }
  .item .ic { width: 14px; height: 14px; border: 1.6px solid currentColor; border-radius: 3px; color: var(--fg-subtle); }
  .sepline { height: 1px; background: var(--edge-default); margin: 4px 0; }
  .grid-bg { background: var(--bg-default);
             background-image: radial-gradient(var(--canvas-grid) 1px, transparent 1px);
             background-size: var(--grid) var(--grid); }

  .tb { display: inline-flex; align-items: center; gap: 4px; padding: 6px;
        background: var(--bg-surface); color: var(--fg-muted);
        border-radius: var(--radius-lg); box-shadow: var(--shadow-bottom); }
  .tb .d { width: 1px; height: 16px; background: var(--edge-default); margin: 0 2px; }
  .ib { position: relative; cursor: pointer; border: none; background: transparent; color: var(--fg-muted);
        border-radius: var(--radius-md); padding: 5px 6px; display: inline-flex; align-items: center; gap: 4px;
        font-family: inherit; font-size: 11px; }
  .ib:hover, .ib.on { background: var(--bg-hover); color: var(--fg-default); }
  .g { display: block; width: 14px; height: 14px; border: 1.6px solid currentColor; border-radius: 3px; }
  .sw { width: 14px; height: 14px; border-radius: var(--radius-full);
        border: var(--border-swatch) solid var(--edge-default); box-sizing: border-box; }
  .sw.sel { border-color: var(--info); transform: scale(1.1); }
  .cap { display: inline-flex; align-items: center; padding: 0 4px; font-size: 11px; color: var(--fg-subtle); }

  .pv { display: block; width: 16px; border-radius: var(--radius-full); background: currentColor; }
  .lasso { fill: color-mix(in srgb, var(--info) 8%, transparent); stroke: var(--info);
           stroke-width: 1; stroke-dasharray: 3 3; }
  .ink { fill: none; stroke: var(--fg-default); stroke-width: 4.5; stroke-linecap: round; }
  .ink.t { stroke: var(--accent-red); stroke-width: 3; }
</style>
