<!-- @dsCard group="Controls" height=140 subtitle="role=switch, 20×36, info when on" -->
<div class="wrap">
  <div class="row"><span class="lbl">off · on</span>
    <span class="sw"><span class="knob"></span></span>
    <span class="sw on"><span class="knob"></span></span>
  </div>
  <div class="row"><span class="lbl">disabled</span>
    <span class="sw dis"><span class="knob"></span></span>
    <span class="sw on dis"><span class="knob"></span></span>
  </div>
  <div class="row"><span class="lbl">in a row</span>
    <span style="font-size:14px">Snap to grid</span>
    <span class="sw on" style="margin-left:8px"><span class="knob"></span></span>
  </div>
  <div class="note">h-5 w-9, <b>rounded-full</b>, 2px transparent border, track <b>edge-default</b> → <b>info</b>,
    knob bg-surface h-4 w-4 with elevation-hover, 200ms ease-in-out, focus ring 2px info with 1px offset.</div>
</div>
