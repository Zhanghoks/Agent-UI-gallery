<!-- @dsCard group="Controls" height=284 subtitle="Button trigger + Popover panel, never a native select" -->
<div class="wrap">
  <div class="row" style="align-items: flex-start">
    <span class="lbl" style="margin-top:6px">closed</span>
    <button class="btn" style="border-radius: var(--radius-sm)">
      <span class="ic" style="width:12px;height:12px"></span>Claude Sonnet<span class="chev">▾</span>
    </button>
    <button class="btn" style="border-radius: var(--radius-full)">Pill trigger<span class="chev">▾</span></button>
  </div>
  <div class="row" style="align-items: flex-start">
    <span class="lbl" style="margin-top:6px">open</span>
    <div class="panel" style="min-width: 232px">
      <div class="grp"><span class="hr"></span>Built-in<span class="hr"></span></div>
      <button class="item"><span class="ic"></span><span>Claude Sonnet</span><span class="chk">✓</span></button>
      <button class="item"><span class="ic"></span><span>Claude Opus</span></button>
      <div class="grp"><span class="hr"></span>External<span class="hr"></span></div>
      <button class="item"><span class="ic"></span>
        <span><span style="display:block">Local agentlet</span>
          <span class="sub">http://127.0.0.1:4310</span></span></button>
      <div class="sepline"></div>
      <div style="padding: 4px 4px 0">
        <button class="item" style="color: var(--info)">Manage agents…</button>
      </div>
    </div>
  </div>
  <div class="note">Trigger is a <b>Button</b> (outline · sm by default, <code>rounded</code> or pill),
    the chevron rotates 180° when open. Panel: 10px uppercase group headers between two hairlines,
    ghost rows, a <b>Check</b> in a fixed 14px lane so labels never shift, optional footer under a divider.</div>
</div>
