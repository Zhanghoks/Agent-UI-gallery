<!-- @dsCard group="Agents" height=176 subtitle="The compact selector density for a chat header" -->
<div class="wrap">
  <div class="row"><span class="lbl">pills</span>
    <button class="sp">Session 3<span class="cv">▾</span></button>
    <button class="sp">claude-sonnet<span class="cv">▾</span></button>
    <button class="sp">Plan mode<span class="cv">▾</span></button>
  </div>
  <div class="row"><span class="lbl">in a header</span>
    <span class="hdr">
      <span class="mk">R</span>
      <button class="sp">Session 3<span class="cv">▾</span></button>
      <button class="sp">claude-sonnet<span class="cv">▾</span></button>
      <span style="flex:1"></span>
      <span class="ring"></span>
    </span>
  </div>
  <div class="note">One constant, <code>COMPACT_TRIGGER_CLASS = 'px-1.5 py-0.5 gap-1'</code>, applied to a
    <b>Select</b>'s pill trigger. It exists so a row of four or five selectors fits a chat panel header without
    each one inventing its own density — the shared class is the contract, not a copied value.</div>
</div>

<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--bg-surface); color: var(--fg-default); }
  .wrap { padding: 14px 16px; background: var(--bg-surface); }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .row + .row { margin-top: 12px; }
  .lbl { font-size: 10px; font-weight: 500; color: var(--fg-subtle); min-width: 84px; }
  .note { margin-top: 12px; padding-top: 10px; border-top: var(--border-hairline) solid var(--edge-default);
          font-size: 11px; line-height: 1.7; color: var(--fg-muted); }
  .note b { color: var(--fg-default); font-weight: 500; }
  code { font-family: var(--font-mono); font-size: 10px; color: var(--fg-default); }
  
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer;
         font-family: inherit; font-size: 12px; line-height: 16px; padding: 4px 10px;
         border-radius: var(--radius-md); border: var(--border-hairline) solid var(--edge-default);
         background: var(--bg-surface); color: var(--fg-muted); }
  .btn:hover { background: var(--bg-hover); }
  .btn.ghost { border: none; background: transparent; }
  .btn.ghost:hover { background: var(--bg-hover); }
  .panel { background: var(--bg-surface); border: var(--border-hairline) solid var(--edge-default);
           border-radius: var(--radius-md); box-shadow: var(--elevation-toast); padding: 4px 0; min-width: 176px; }
  .item { display: flex; align-items: center; gap: 8px; width: 100%; box-sizing: border-box;
          padding: 6px 12px; font-size: 12px; font-weight: 500; color: var(--fg-muted);
          background: transparent; border: none; cursor: pointer; text-align: left; }
  .item:hover { background: var(--bg-hover); }
  .item .sc { margin-left: auto; font-size: 12px; font-weight: 400; color: var(--fg-subtle); }
  .item .ic { width: 14px; height: 14px; border: 1.6px solid currentColor; border-radius: 3px; color: var(--fg-subtle); }
  .sepline { height: 1px; background: var(--edge-default); margin: 4px 0; }
  .grid-bg { background: var(--bg-default);
             background-image: radial-gradient(var(--canvas-grid) 1px, transparent 1px);
             background-size: var(--grid) var(--grid); }

  .sp { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; font-family: inherit;
        font-size: 12px; color: var(--fg-muted); background: var(--bg-surface);
        border: var(--border-hairline) solid var(--edge-default); border-radius: var(--radius-full);
        padding: 2px 6px; }
  .sp:hover { background: var(--bg-hover); }
  .cv { font-size: 9px; color: var(--fg-subtle); }
  .hdr { display: flex; align-items: center; gap: 6px; width: 440px; padding: 6px 8px;
         background: var(--bg-surface); border: var(--border-hairline) solid var(--edge-default);
         border-radius: var(--radius-md); }
  .mk { width: 20px; height: 20px; border-radius: var(--radius-full); background: var(--accent-teal);
        color: var(--fg-inverse); font-size: 10px; font-weight: 500;
        display: inline-flex; align-items: center; justify-content: center; }
  .ring { width: 16px; height: 16px; border-radius: var(--radius-full);
          border: 2px solid var(--edge-default); border-top-color: var(--fg-muted); }
</style>
