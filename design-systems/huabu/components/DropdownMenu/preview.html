<!-- @dsCard group="Controls" height=248 subtitle="Square rows, no radius, full bleed" -->
<div class="wrap">
  <div class="row" style="align-items:flex-start">
    <span class="lbl" style="margin-top:6px">menu</span>
    <div class="panel" style="min-width:176px">
      <button class="item"><span class="ic"></span><span class="fl">New Space</span><span class="sc">⌘N</span></button>
      <button class="item"><span class="ic"></span><span class="fl">Open…</span><span class="sc">⌘O</span></button>
      <div class="sepline"></div>
      <button class="item"><span class="ic"></span><span class="fl">Export canvas</span></button>
      <button class="item"><span class="ic"></span><span class="fl">Keyboard shortcuts</span><span class="sc">?</span></button>
      <div class="sepline"></div>
      <button class="item"><span class="ic"></span><span class="fl">Settings</span><span class="sc">⌘,</span></button>
    </div>
    <div class="panel" style="min-width:176px">
      <button class="item hov"><span class="ic"></span><span class="fl">Add to Space</span></button>
      <button class="item"><span class="ic"></span><span class="fl">Open in preview</span><span class="sc">↵</span></button>
      <button class="item" style="color: var(--danger)"><span class="ic" style="color:inherit"></span><span class="fl">Delete node</span><span class="sc">⌫</span></button>
    </div>
  </div>
  <div class="note">Rows are ghost <b>Button</b>s at <code>rounded-none px-3 py-1.5 text-xs</code> so the hover fill
    bleeds to the panel's edges. Icon <b>fg-subtle</b> 16px, label flexes, shortcut <b>fg-subtle</b> pushed right by
    <code>ml-4</code>. Dividers are 1px <b>edge-default</b>. A link row is an anchor, not a button, so ⌘-click still
    opens a new tab.</div>
</div>

<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--bg-surface); color: var(--fg-default); }
  .wrap { padding: 14px 16px; background: var(--bg-surface); }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .row + .row { margin-top: 12px; }
  .lbl { font-size: 10px; font-weight: 500; color: var(--fg-subtle); min-width: 84px; }
  .note { margin-top: 12px; padding-top: 10px; border-top: var(--border-hairline) solid var(--edge-default);
          font-size: 11px; line-height: 1.7; color: var(--fg-muted); }
  .note b { color: var(--fg-default); font-weight: 500; }
  code { font-family: var(--font-mono); font-size: 10px; color: var(--fg-default); }
  
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer;
         font-family: inherit; font-size: 12px; line-height: 16px; padding: 4px 10px;
         border-radius: var(--radius-md); border: var(--border-hairline) solid var(--edge-default);
         background: var(--bg-surface); color: var(--fg-muted); }
  .btn:hover { background: var(--bg-hover); }
  .btn.ghost { border: none; background: transparent; }
  .btn.ghost:hover { background: var(--bg-hover); }
  .panel { background: var(--bg-surface); border: var(--border-hairline) solid var(--edge-default);
           border-radius: var(--radius-md); box-shadow: var(--elevation-toast); padding: 4px 0; min-width: 176px; }
  .item { display: flex; align-items: center; gap: 8px; width: 100%; box-sizing: border-box;
          padding: 6px 12px; font-size: 12px; font-weight: 500; color: var(--fg-muted);
          background: transparent; border: none; cursor: pointer; text-align: left; }
  .item:hover { background: var(--bg-hover); }
  .item .sc { margin-left: auto; font-size: 12px; font-weight: 400; color: var(--fg-subtle); }
  .item .ic { width: 14px; height: 14px; border: 1.6px solid currentColor; border-radius: 3px; color: var(--fg-subtle); }
  .sepline { height: 1px; background: var(--edge-default); margin: 4px 0; }
  .grid-bg { background: var(--bg-default);
             background-image: radial-gradient(var(--canvas-grid) 1px, transparent 1px);
             background-size: var(--grid) var(--grid); }

  .fl { flex: 1; }
  .item.hov { background: var(--bg-hover); }
</style>
