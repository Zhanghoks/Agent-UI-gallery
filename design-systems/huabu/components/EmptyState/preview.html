<!-- @dsCard group="Controls" height=212 subtitle="One quiet line, optional action" -->
<div class="wrap">
  <div class="es">
    <p class="em">Nothing on this canvas yet. Drop a file, or press N for a note.</p>
    <div class="ea"><button class="btn">Add a note</button></div>
  </div>
  <div class="note">A centred column with <code>py-20</code>. Message: <b>sm</b> in <b>fg-subtle</b> — the quietest
    text colour in the system, because an empty surface is not a problem. Optional action <code>mt-4</code>.
    No illustration, no icon, no heading.</div>
</div>

<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--bg-surface); color: var(--fg-default); }
  .wrap { padding: 14px 16px; background: var(--bg-surface); }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

  .note { margin-top: 12px; padding-top: 10px; border-top: var(--border-hairline) solid var(--edge-default);
          font-size: 11px; line-height: 1.7; color: var(--fg-muted); }
  .note b { color: var(--fg-default); font-weight: 500; }
  code { font-family: var(--font-mono); font-size: 10px; color: var(--fg-default); }
  
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer;
         font-family: inherit; font-size: 12px; line-height: 16px; padding: 4px 10px;
         border-radius: var(--radius-md); border: var(--border-hairline) solid var(--edge-default);
         background: var(--bg-surface); color: var(--fg-muted); }
  .btn:hover { background: var(--bg-hover); }
  .btn.ghost { border: none; background: transparent; }
  .btn.ghost:hover { background: var(--bg-hover); }

  .es { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 48px 0; }
  .em { margin: 0; font-size: 14px; color: var(--fg-subtle); }
