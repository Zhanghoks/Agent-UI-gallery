<!-- @dsCard group="Controls" height=156 subtitle="A mono field with a folder picker welded on" -->
<div class="wrap">
  <div class="row"><span class="lbl">md · default</span>
    <span class="pi">
      <input class="ti md mono" style="width:270px; border-top-right-radius:0; border-bottom-right-radius:0" value="~/Documents/Spaces" />
      <button class="btn" style="aspect-ratio:1; padding:6px; border-top-left-radius:0; border-bottom-left-radius:0"><span class="fold"></span></button>
    </span>
  </div>
  <div class="row"><span class="lbl">sm · picking</span>
    <span class="pi">
      <input class="ti sm mono" style="width:230px; border-top-right-radius:0; border-bottom-right-radius:0" placeholder="Choose a Home folder" />
      <button class="btn" style="aspect-ratio:1; padding:5px; border-top-left-radius:0; border-bottom-left-radius:0"><span class="spin"></span></button>
    </span>
  </div>
  <div class="note">Mono <b>TextInput</b> plus an <b>outline</b> icon Button at a 1:1 aspect ratio, joined at the seam;
    the folder glyph is 14px (sm) / 16px (md) in <b>fg-subtle</b> and swaps to an inline <b>Loading</b> spinner
    while the native dialog is open.</div>
</div>
