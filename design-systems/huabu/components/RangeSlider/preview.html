<!-- @dsCard group="Controls" height=152 subtitle="Grey track, info thumb, width-stable" -->
<div class="wrap">
  <div class="row"><span class="lbl">sm · in a toolbar</span>
    <span class="tb">
      <span class="track" style="width:112px"><span class="thumb sm" style="left:38%"></span></span>
      <span class="ro sm">12</span>
    </span>
  </div>
  <div class="row"><span class="lbl">md · in a panel</span>
    <span class="track" style="width:144px"><span class="thumb md" style="left:70%"></span></span>
    <span class="ro md">24</span>
  </div>
  <div class="note">Track <b>edge-default</b> h-1.5 rounded-full, thumb <b>info</b> 12px (sm) / 16px (md), no border.
    Readout <b>fg-subtle</b> tabular-nums with a min-width, so dragging never reflows the toolbar.</div>
</div>

<style>
